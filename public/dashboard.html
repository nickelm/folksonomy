<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - folksonomy</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="dashboard">
  <div class="dash-wrap">
    <header class="masthead">
      <h1 id="sheet-title">Loading...</h1>
      <p id="sheet-sub"></p>
    </header>

    <nav id="picker" class="picker" aria-label="Question" hidden></nav>

    <p id="empty" class="empty" hidden>
      Nothing to show yet. Panels appear as the presenter opens each question.
    </p>

    <main id="grid" class="panel-grid" hidden></main>
  </div>

  <script src="/vendor/d3.min.js"></script>
  <script src="/vendor/d3.layout.cloud.js"></script>
  <script type="module" src="/dashboard.js"></script>
</body>
</html>
