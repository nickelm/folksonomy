<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - folksonomy</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="dashboard">
  <div class="dash-wrap">
    <header class="masthead">
      <h1 id="sheet-title">Loading...</h1>
      <p id="sheet-sub"></p>
    </header>

    <section class="panel join dash-join" id="join" aria-label="How to join">
      <div class="join-main">
        <div class="join-url" id="join-url"></div>
        <p class="join-hint" id="join-hint">Open this address on your phone, or scan the code.</p>
      </div>
      <div id="advance" class="advance"></div>
      <div class="join-qr" id="qr"></div>
    </section>

    <nav id="picker" class="picker" aria-label="Question" hidden></nav>

    <p id="empty" class="empty" hidden>
      Nothing to show yet. Panels appear as the presenter opens each question.
    </p>

    <main id="grid" class="panel-grid" hidden></main>
  </div>

  <script src="/vendor/d3.min.js"></script>
  <script src="/vendor/d3.layout.cloud.js"></script>
  <script type="module" src="/dashboard.js"></script>
</body>
</html>
